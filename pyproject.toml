# Project metadata and the dependency set of the standalone pipeline.
#
# The pipeline is a set of flat modules under standalone_CA/pipeline that
# import each other by name and are run as scripts (run_pipeline.sh), so
# this file installs the dependencies and the test tooling, not an
# importable package: `pip install -e ".[dev]"` then `pytest`. The GRASS
# stages (slope, hydrology) need GRASS GIS on the machine and are outside
# pip; the tests do not need them.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhsvm-stream-toolkit"
version = "2026.9.0"
description = "DHSVM spatial inputs, stream network and initial states from a DEM and a watershed polygon"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yiyun Song"}]
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pycodestyle>=2.11", "pyflwdir>=0.5", "scipy>=1.10"]
analysis = ["pyflwdir>=0.5", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/waveletswave/DHSVM_Stream_Toolkit_ThatWorks"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["standalone_CA/tests"]
addopts = "-q -p no:cacheprovider"
