# Runs the standalone pipeline tests on every push and pull request:
# the synthetic network tests and the CA 28 m regression against the
# audited stream files. rasterio and geopandas install from wheels, so no
# system GDAL is needed; the GRASS stages are not exercised here.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
